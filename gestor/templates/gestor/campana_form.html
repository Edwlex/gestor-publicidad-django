{% extends 'gestor/base.html' %}
{% block title %}{% if object %}Editar Campaña{% else %}Nueva Campaña{% endif %}{% endblock %}

{% block content %}
<div class="card p-4 mx-auto" style="max-width: 600px;">
    <h3 class="mb-4">{% if object %}✏️ Editar Campaña{% else %}➕ Nueva Campaña{% endif %}</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'campana_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
